[package]
name = "reef-app"
description = "reef's UI: a Dioxus fullstack app on axum that picks a plan, draws it and edits it, and serves the JSON API beside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# No default: dx keeps default features on in the wasm build too, and each side wants its own.
default = []
# the wasm client: Dioxus's web renderer, and what only a browser can do for the canvas, and
# never shoal or the service
web = ["dioxus/web", "reef-draw/web", "dep:web-sys", "dep:wasm-bindgen"]
# the server: Dioxus's axum server, the service and the JSON API's router over shoal's client half
# (reef-model's YAML, for the editor's server functions)
server = ["dioxus/server", "dep:reef-service", "dep:tokio", "dep:axum", "dep:anyhow", "dep:tracing", "reef-model/parse"]
# shoal's engine inside the server, which needs nightly, glommio and target-cpu=native
embedded = ["server", "reef-service/embedded"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack", "router"] }
serde = { workspace = true }
serde_json = { workspace = true }
# the service's data types, which the server functions answer with, and the API's paths
reef-api = { workspace = true }
reef-model = { workspace = true }
reef-service = { path = "../reef-service", optional = true }
# what the canvas draws: box sizes, the layout, the camera, the search, the criteria and the charts
reef-draw = { workspace = true }
# the layout's direction and paths, which the canvas's arrows are drawn along
reef-layout = { workspace = true }
web-sys = { version = "0.3", features = [
  "Clipboard", "Document", "DomRect", "DomTokenList", "Element", "EventSource", "EventTarget", "HtmlElement",
  "Navigator", "NodeList", "Performance", "PointerEvent", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage",
  "WheelEvent", "Window", "console",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
tokio = { workspace = true, features = ["net", "signal"], optional = true }
axum = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# the terminal's client, to put plans through the CLI as a user would
reef = { workspace = true }
# the diagram rendered natively, and parsed, to check it against reef-draw's markup
dioxus-ssr = "=0.7.10"
roxmltree = "0.20"
reqwest = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

# The suite opens shoal in-process, so it needs the engine: run it with `--features embedded`.
[[test]]
name = "app"
required-features = ["embedded"]

# The suite's server asks every caller to sign in, so it runs in a process of its own.
[[test]]
name = "sign_in"
required-features = ["embedded"]
