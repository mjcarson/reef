[package]
name = "reef-service"
description = "reef's store and service: the only code that touches shoal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No default: dx keeps default features on in the wasm build too, which would pull shoal's engine
# into the client. Without `embedded` this is shoal's client half alone, and builds on stable.
default = []
# shoal's engine inside this process, which needs nightly, glommio and target-cpu=native
embedded = ["shoal/server", "dep:libc"]

[dependencies]
shoal.workspace = true
rkyv.workspace = true
deepsize2.workspace = true
reef-model.workspace = true
reef-render.workspace = true
# with its prompt, which `reef-serve recover` asks a lost admin's new password with
reef-api = { workspace = true, features = ["prompt"] }
# with HTTP/2, which a browser speaks over TLS, carrying all its tabs' streams on one connection
axum = { workspace = true, features = ["http2"] }
tokio-stream.workspace = true
# a change stream cut short once its token signs nobody in, at the version axum's tree holds
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs", "process"] }
tracing.workspace = true
# statfs and getrlimit, for the checks before an in-process pool starts
libc = { workspace = true, optional = true }
# users' passwords, kept as argon2id hashes, and tokens, random and kept by their SHA-256
argon2.workspace = true
sha2.workspace = true
getrandom.workspace = true
# a remote project's docs, read from its bare clone at a commit, and git URLs read as git reads them
gix = { version = "=0.90.0", default-features = false, features = ["sha1"] }
# every listener's TLS, and the head of a plain-HTTP request, answered with a redirect to it
tokio-rustls.workspace = true
httparse = "1"
# reef's own CA and the certificate it signs, made when none is configured, and their dates
rcgen.workspace = true
time = "0.3"

[dev-dependencies]
# a client of the JSON API that knows only reef-api's types, and offers HTTP/2 over TLS
reqwest = { workspace = true, features = ["http2"] }
# the CLI and the MCP server, driven in-process against a served service
reef.workspace = true
# the pipe the MCP server's suite speaks JSON-RPC over
tokio = { workspace = true, features = ["io-util"] }
