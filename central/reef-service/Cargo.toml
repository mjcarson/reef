[package]
name = "reef-service"
description = "reef's store and service: the only code that touches shoal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No default: dx keeps default features on in the wasm build too, which would pull shoal's engine
# into the client. Without `embedded` this is shoal's client half alone, and builds on stable.
default = []
# shoal's engine inside this process, which needs nightly, glommio and target-cpu=native
embedded = ["shoal/server", "dep:libc"]

[dependencies]
shoal.workspace = true
rkyv.workspace = true
deepsize2.workspace = true
reef-model.workspace = true
reef-render.workspace = true
reef-api.workspace = true
axum.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }
tracing.workspace = true
# statfs and getrlimit, for the checks before an in-process pool starts
libc = { workspace = true, optional = true }

[dev-dependencies]
# a client of the JSON API that knows only reef-api's types
reqwest.workspace = true
# the CLI, driven in-process against a served service
reef.workspace = true
