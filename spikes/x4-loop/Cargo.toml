# X4's scratch crate: a stub reef MCP server and Claude Code hooks that drive one session
# through several nodes, clearing its context between them.
# It is a workspace of its own, like the other spikes.
[workspace]

[package]
name = "x4-loop"
description = "X4's spike: the terminal feed loop, with context cleared between nodes"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
