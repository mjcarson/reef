[package]
name = "x1-app"
description = "X1's scratch Dioxus fullstack server, with shoal in-process or external"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# No default: dx keeps default features on in the wasm build too, which would pull shoal (and
# tokio's net) into the client. In-process is the server's runtime default instead, when no
# external node is configured, and `embedded` is passed to the server build alone.
default = []
# the wasm client: Dioxus's web renderer, and never shoal (gxhash can't target wasm)
web = ["dioxus/web"]
# the server: Dioxus's axum server and shoal's client half, which builds on stable
server = ["dioxus/server", "dep:shoal", "dep:rkyv", "dep:deepsize2", "dep:tokio", "dep:axum", "dep:tracing", "dep:anyhow"]
# shoal's engine inside the server, which needs nightly, glommio and target-cpu=native
embedded = ["server", "shoal/server"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
shoal = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
deepsize2 = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
axum = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
