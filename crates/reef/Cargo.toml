[package]
name = "reef"
description = "reef's terminal client and MCP server: projects, plans and nodes as YAML, through the service's JSON API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# the service's data types, and the JSON API's requests, answers, routes and config location
reef-api = { path = "../reef-api" }
# plan names, and the frontmatter `reef node put` reads and `reef node get` prints
reef-model = { workspace = true, features = ["parse"] }
# a book's node files read as mdbook-reef reads them, and the links in them moved for import
reef-render.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "1"
# plain HTTP to the service on localhost, at the version central's tests resolve
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# reqwest's runtime, which the MCP server runs on too, over standard input and output, and
# the clear's injector, which runs zellij, tmux and `claude agents` and waits between looks
tokio = { version = "1", features = ["rt", "macros", "io-std", "process", "time"] }
# the MCP server: its tools by rmcp's router, served over stdio, as X4's stub served them
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
# each tool's arguments as the JSON schema its listing carries
schemars = "1"
# a node's checkout read in-process: HEAD, branches, merge-base, the pin, a node's diff and the
# carry of its start, all but the snapshot, which gix can't stage. Pinned, since it is 0.x and
# breaks often; X3 chose it over git2, which builds libgit2 from C and runs no filter drivers
gix = { version = "=0.90.0", default-features = false, features = ["blob-diff", "merge", "revision", "sha1", "max-performance"] }
