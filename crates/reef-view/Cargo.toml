[package]
name = "reef-view"
description = "The in-browser viewer for reef planning graphs (wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["autostart"]
# Draw every `div.reef` on the page once it loads, as the static mode's `reef.js` does. An app
# that links the viewer into its own wasm turns this off and calls `mount` itself.
autostart = []

[dependencies]
reef-model.workspace = true
reef-layout.workspace = true
# the boxes, sidebar and charts it draws, shared with reef-app's canvas, and the docs it reads
reef-draw = { workspace = true, features = ["web"] }
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions", "CanvasRenderingContext2d", "CssStyleDeclaration", "Document", "DomRect",
  "DomParser", "DomStringMap", "DomTokenList", "HtmlDetailsElement", "Response", "SupportedType", "Url", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement",
  "HtmlInputElement", "KeyboardEvent", "Location", "MouseEvent", "MutationObserver", "MutationObserverInit", "Node", "NodeList", "Performance",
  "PointerEvent", "ResizeObserver", "Storage", "TextMetrics", "WheelEvent", "Window", "console",
] }
