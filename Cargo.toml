[workspace]
resolver = "3"
members = ["crates/reef-model", "crates/reef-layout", "crates/reef-render", "crates/reef-view", "crates/mdbook-reef", "crates/reef-api", "xtask"]
# Spikes are workspaces of their own, on whatever toolchain they need (X1's runs shoal on nightly),
# and so is `central`, the service that keeps plans in shoal, so this workspace never resolves shoal.
exclude = ["spikes", "central"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjcarson/reef"

[workspace.dependencies]
reef-model = { path = "crates/reef-model", default-features = false }
reef-layout = { path = "crates/reef-layout" }
reef-render = { path = "crates/reef-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# The viewer's build: small over fast, it is downloaded by every page that draws a plan.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
